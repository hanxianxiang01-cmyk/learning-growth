name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run governance:check
      - run: npm run branch:check
      - run: npm run release:check

  child-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/child-web/package.json
      - run: npm install
      - run: npm run child:typecheck

  child-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/child-web/package.json
      - run: npm install
      - run: npm run child:build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learning-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/learning-api/pyproject.toml
      - name: Install backend + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (pure unit tests, no DB required)
        run: PYTHONPATH=. python -m pytest tests/ -q
