name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run governance:check
      - run: npm run branch:check
      - run: npm run release:check

  child-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run child:typecheck
      - name: V6 pure-module and full migration inventory checks
        run: npm run child:v6:check

  # 两套皮肤各构建一次。job 名不能直接叫 child-build：matrix 会把 check 名
  # 变成 "child-build (exploration-lab)"，而仓库 ruleset protect-main 要求的
  # context 是精确的 "child-build" —— 对不上就永远 blocked。
  # 故矩阵 job 用 child-build-matrix 承载，再由下面的 child-build 汇总成一个具名检查点。
  #
  # ⚠️ 聚合 job 只写 `needs:` 是**不够**的：矩阵里任一实例失败时，下游 job 会被
  # 判为 "skipped"，而 skipped 不是 failure，不能可靠阻断合并（GitHub 文档：
  # 被跳过的 dependent job 其 check 结论为 skipped，不会被当作失败）。
  # 所以下面显式写了 `if: always()` + 校验 needs 的 result == 'success'，
  # 让"矩阵失败"真实转化成"required check 失败"。改动此处请先读
  # docs/frontend/42_v6_full_migration/REVIEW_2026-10-30.md §10。
  child-build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skin: [exploration-lab, healing]
    env:
      NEXT_PUBLIC_CHILD_UI_VERSION: v6
      NEXT_PUBLIC_CHILD_MATH_SKIN: ${{ matrix.skin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run child:build
      # === 临时探针（仅用于验证聚合门禁的失败传播，验证后整个分支删除）===
      # 只让 healing 失败，exploration-lab 保持成功，以证明"部分皮肤失败"也能判 failure。
      - name: PROBE - fail healing build on purpose
        if: matrix.skin == 'healing'
        run: |
          echo "::error::PROBE 故意让 healing 构建失败，用于验证 child-build 聚合门禁"
          exit 1

  child-build:
    needs: child-build-matrix
    # always() 保证矩阵失败/取消时本 job 仍然执行，从而把结果如实判成 failure；
    # 缺了它，本 job 会被 skipped，skipped 不会被当作失败。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both skins must build
        run: |
          result="${{ needs.child-build-matrix.result }}"
          echo "child-build-matrix.result = $result"
          if [ "$result" != "success" ]; then
            echo "::error::双皮肤构建门禁不通过（result=$result）。任一皮肤失败、取消或被跳过，都在此判失败。"
            exit 1
          fi
          echo "exploration-lab 与 healing 两套皮肤构建均已通过。"

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learning-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/learning-api/pyproject.toml
      - name: Install backend + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (pure unit tests, no DB required)
        run: PYTHONPATH=. python -m pytest tests/ -q

  v6-ui-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace @learning/child-web exec -- playwright install --with-deps chromium
      - name: Start V6 preview (no live backend, no seeding)
        run: |
          npm run child:v6:preview > /tmp/v6-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3100/dev/v6 > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/v6-dev.log
          exit 1
      - run: npm run child:v6:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-gallery-browser-results
          path: apps/child-web/test-results-v6
