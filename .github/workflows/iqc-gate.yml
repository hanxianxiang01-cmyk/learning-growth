name: IQC Quality Gate

on:
  pull_request:
    paths:
      - "scripts/iqc/**"
      - "apps/learning-api/app/content/**"
      - "apps/learning-api/app/services/jump_process.py"
      - "apps/child-web/src/features/task-renderer/**"
      - "apps/child-web/src/components/renderers/**"
      - ".github/workflows/iqc-gate.yml"
  # schedule 移除（架构裁决方案 A）：托管 Runner 连不通 RDS 白名单（10-17/10-18
  # 两次 schedule run 扫描步失败实锤；Actions 出口 7038 动态网段不可白名单化）。
  # 夜间全量已移交本机 launchd 09:00（~/IQC-nightly）；dispatch 保留手动应急。

jobs:
  # PR 增量：确定性门（DB-free）——夹具回归/契约镜像/覆盖一致性
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: IQC PR gate（失败不静默；仅规则明确证据充分的 P0/P1 阻断）
        run: python scripts/iqc/pr_gate.py
  # nightly-full 已整体移除（最终运行方式裁决 2026-10-19）：
  # GitHub 托管 Runner 连不通 RDS 白名单，schedule 与 workflow_dispatch 均
  # 不构成可用全量扫描入口——保留只会制造"好像能跑"的误导。
  # 全量扫描唯一执行方式＝Mac 手动：~/IQC-nightly/run_iqc_nightly.sh
  # （Keychain 只读凭证、动态全状态、趋势自动 diff）。
  # GitHub 职责收敛为：代码变更时的 PR 质量门禁（pr-gate，DB-free）。
