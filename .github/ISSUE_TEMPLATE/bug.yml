name: Bug
description: Report a reproducible defect
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, mode (mock/http), route, browser/device.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
